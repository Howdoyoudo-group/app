    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PPVT9V863C');

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Swap PWA manifest + apple-touch icon BEFORE Safari reads them,
      // so "Add to Home Screen" on /howdy installs the Howdy app, not the main site.
      (function () {
        var isHowdy = /^\/howdy(\/|$)/.test(window.location.pathname);
        var manifest = isHowdy ? "/manifest-howdy.json?v=14" : "/manifest.json?v=14";
        var appleIcon = isHowdy ? "/apple-touch-icon-howdy-character.png?v=14" : "/apple-touch-icon-main.png?v=14";
        var title = isHowdy ? "Howdy" : "How do you do?";
        document.write(
          '<link rel="manifest" href="' + manifest + '" />' +
          '<link rel="apple-touch-icon" sizes="180x180" href="' + appleIcon + '" />' +
          '<link rel="apple-touch-icon-precomposed" sizes="180x180" href="' + appleIcon + '" />' +
          '<meta name="apple-mobile-web-app-title" content="' + title + '" />' +
          '<meta name="application-name" content="' + title + '" />'
        );
      })();
    </script>
    <link rel="icon" href="/favicon.ico?v=14" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=14" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-main-192.png?v=14" />
    <meta name="theme-color" content="#00E600" />
    <title>How Do You Do?</title>
    <!-- No static <meta name="description"> here on purpose: react-helmet-async
         (SEO.tsx) sets a per-page one on every route once JS runs, and Google/Bing
         both execute JS reliably. A static duplicate here left two conflicting
         description tags in the DOM (found 2026-09-01) - og:description below stays
         static, since it's the fallback for no-JS social-preview bots (Slack,
         WhatsApp, Twitter) that never run the JS override at all. -->
    <meta name="author" content="Howdoyoudo" />
    <meta name="google-site-verification" content="DBXt8kJboLL3wjSvIZUFxHAPlT6vmpV9p2mmSgvvsNc" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.howdoyoudo.co.uk/" />
    <meta property="og:title" content="How Do You Do?">
    <meta property="og:description" content="Explore careers across 34 UK industries — from fashion and football to farming and formula 1. Discover jobs, guides, role maps, and what it's really like to work in the industries you love.">
    <meta property="og:image" content="https://www.howdoyoudo.co.uk/og-share.jpg">
    <meta property="og:image:secure_url" content="https://www.howdoyoudo.co.uk/og-share.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="How Do You Do?">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@howdoyoudo" />

    <meta name="twitter:description" content="Explore careers across 34 UK industries — from fashion and football to farming and formula 1. Discover jobs, guides, role maps, and what it's really like to work in the industries you love.">
    <meta name="twitter:image" content="https://www.howdoyoudo.co.uk/og-share.jpg">
